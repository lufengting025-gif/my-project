<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10231b" />
    <title>贪吃蛇小游戏</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header>
        <p class="eyebrow">SNAKE GAME</p>
        <h1>贪吃蛇</h1>
        <div class="stats" aria-label="游戏得分">
          <span>得分 <strong id="score">0</strong></span>
          <span>最高分 <strong id="high-score">0</strong></span>
        </div>
      </header>

      <section class="board-wrap" aria-label="贪吃蛇游戏区域">
        <canvas id="game" width="400" height="400" aria-label="使用方向键或 WASD 控制贪吃蛇"></canvas>
        <div id="message" class="message" role="status">
          <strong>准备开始？</strong>
          <span>按方向键、WASD 或点击开始游戏</span>
          <button id="start-button" type="button">开始游戏</button>
        </div>
      </section>

      <footer>
        <p>使用 <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动</p>
        <div class="touch-controls" aria-label="触屏控制">
          <button type="button" data-direction="up" aria-label="向上移动">↑</button>
          <button type="button" data-direction="left" aria-label="向左移动">←</button>
          <button type="button" data-direction="down" aria-label="向下移动">↓</button>
          <button type="button" data-direction="right" aria-label="向右移动">→</button>
        </div>
      </footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
